[package]
name = "swage-anchor"
version = "0.1.0"
edition = "2024"
description = "Deterministic page-anchoring facility for Swage (/dev/anchor kernel-module client): pins an attacker-owned frame and transplants it under a victim page-table entry."
repository = "https://github.com/UzL-ITS/swage"
license = "MIT"
keywords = ["rowhammer", "security", "memory", "kernel", "placement"]
categories = ["security"]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
log = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
anyhow = "1.0"
serde_json = { workspace = true }
